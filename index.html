<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobradar</title>
  <meta name="description" content="Die neusten Kreativ-Jobs in deiner Nähe an einem Ort.">
  <meta name="theme-color" content="#4338ca">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Kopfzeile mit Titel und Profil-Button -->
    <header class="kopf">
      <div>
        <h1>Jobradar</h1>
        <p id="stand" class="stand"></p>
      </div>
      <button type="button" id="profil-btn" class="icon-btn" aria-label="Profil bearbeiten">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </button>
    </header>

    <!-- Offline-Banner -->
    <div id="offline" class="banner" role="status" hidden></div>

    <!-- Stellenliste (Skeleton, Karten oder Keine-Treffer-Hinweis) -->
    <main id="liste" class="liste" aria-live="polite" aria-busy="true"></main>
  </div>

  <!-- Steckbrief-Pop-up -->
  <dialog id="steckbrief" class="dialog" aria-labelledby="sb-titel">
    <div class="dialog-inhalt">
      <button type="button" class="schliessen" data-schliessen aria-label="Steckbrief schliessen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <div id="sb-inhalt"></div>
    </div>
  </dialog>

  <!-- Profil-Pop-up -->
  <dialog id="profil" class="dialog seite" aria-labelledby="pf-titel">
    <div class="dialog-inhalt">
      <button type="button" id="pf-x" class="schliessen" data-schliessen aria-label="Profil schliessen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <div id="pf-inhalt"></div>
      <input type="file" id="pf-datei" accept=".json,application/json" hidden>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
